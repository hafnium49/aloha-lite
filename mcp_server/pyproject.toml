[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aloha-lite-mcp-server"
version = "0.1.0"
description = "Playwright-backed MCP bridge for Claude Desktop in ALOHA-Lite robot system"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "ALOHA-Lite Team"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.8"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "websockets>=10.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0.0",
    "black>=21.0.0",
    "flake8>=3.8.0",
    "mypy>=0.910",
]

[project.urls]
Homepage = "https://github.com/hafnium49/aloha-lite"
Repository = "https://github.com/hafnium49/aloha-lite.git"
Issues = "https://github.com/hafnium49/aloha-lite/issues"

[project.scripts]
mcp-server = "mcp_server.main:main"

[tool.black]
line-length = 100
target-version = ['py38']

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
