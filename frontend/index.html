<!DOCTYPE html><html><meta charset="utf-8">
<title>Colour-Mix Console</title>
<style>
body{font-family:Arial,Helvetica,sans-serif;margin:2rem;max-width:480px}
label,button{display:block;margin-top:1rem}
img{max-width:100%}
.color-ratio{display:flex;align-items:center;gap:1rem;margin-top:0.5rem}
.color-ratio input{flex:1;min-width:60px}
.color-ratio span{min-width:60px;font-weight:bold}
#total-volume{margin-top:1rem}
#color-preview{width:100%;height:40px;margin-top:1rem;border:2px solid #ccc;border-radius:4px}
</style>
<h1>Color Mix + Snapshot Demo</h1>

<label>Color Ratios (parts)</label>
<div class="color-ratio">
  <span style="color:#dc3545">Red:</span>
  <input id="red-ratio" type="number" min="0" max="100" step="0.1" value="1" onchange="updatePreview()">
</div>
<div class="color-ratio">
  <span style="color:#ffc107">Yellow:</span>
  <input id="yellow-ratio" type="number" min="0" max="100" step="0.1" value="1" onchange="updatePreview()">
</div>
<div class="color-ratio">
  <span style="color:#007bff">Blue:</span>
  <input id="blue-ratio" type="number" min="0" max="100" step="0.1" value="1" onchange="updatePreview()">
</div>

<div id="color-preview"></div>

<button onclick="send()">Dispense Mix & Snap</button>
<pre id="log"></pre>
<img id="snap">

<script>
async function sleep(ms){return new Promise(r=>setTimeout(r,ms))}

function updatePreview(){
  const red = parseFloat(document.querySelector('#red-ratio').value) || 0
  const yellow = parseFloat(document.querySelector('#yellow-ratio').value) || 0
  const blue = parseFloat(document.querySelector('#blue-ratio').value) || 0
  
  const total = red + yellow + blue
  if(total === 0) {
    document.querySelector('#color-preview').style.background = '#f8f9fa'
    return
  }
  
  // Calculate percentages
  const redPct = (red / total * 100).toFixed(1)
  const yellowPct = (yellow / total * 100).toFixed(1)
  const bluePct = (blue / total * 100).toFixed(1)
  
  // Create gradient preview
  const gradient = `linear-gradient(to right, 
    #dc3545 0%, #dc3545 ${redPct}%, 
    #ffc107 ${redPct}%, #ffc107 ${parseFloat(redPct) + parseFloat(yellowPct)}%, 
    #007bff ${parseFloat(redPct) + parseFloat(yellowPct)}%, #007bff 100%)`
  
  document.querySelector('#color-preview').style.background = gradient
  
  // Update button text with ratios (show up to 1 decimal place)
  const button = document.querySelector('button')
  const redDisplay = red % 1 === 0 ? red.toString() : red.toFixed(1)
  const yellowDisplay = yellow % 1 === 0 ? yellow.toString() : yellow.toFixed(1)
  const blueDisplay = blue % 1 === 0 ? blue.toString() : blue.toFixed(1)
  button.textContent = `Dispense Mix (${redDisplay}:${yellowDisplay}:${blueDisplay}) & Snap`
}

async function send(){
  try {
    const redRatio = parseFloat(document.querySelector('#red-ratio').value) || 0
    const yellowRatio = parseFloat(document.querySelector('#yellow-ratio').value) || 0
    const blueRatio = parseFloat(document.querySelector('#blue-ratio').value) || 0
    
    const totalParts = redRatio + yellowRatio + blueRatio
    if(totalParts === 0) {
      log('Error: At least one color ratio must be greater than 0')
      return
    }
    
    // Calculate normalized ratios (as percentages)
    const redPercent = (redRatio / totalParts * 100).toFixed(2)
    const yellowPercent = (yellowRatio / totalParts * 100).toFixed(2)
    const bluePercent = (blueRatio / totalParts * 100).toFixed(2)
    
    log(`Mix ratios - Red:${redRatio} Yellow:${yellowRatio} Blue:${blueRatio}`)
    log(`Percentages - Red:${redPercent}% Yellow:${yellowPercent}% Blue:${bluePercent}%`)
    
    // Determine dominant color for compatibility
    let dominantColor = 'red'
    let dominantRatio = redRatio
    
    if(yellowRatio > dominantRatio) {
      dominantColor = 'yellow'
      dominantRatio = yellowRatio
    }
    if(blueRatio > dominantRatio) {
      dominantColor = 'blue'
      dominantRatio = blueRatio
    }
    
    const body = {
      mix_id: 1,
      run_id: 1,
      colour: dominantColor,
      color_ratios: {
        red: redRatio,
        yellow: yellowRatio, 
        blue: blueRatio
      },
      normalized_percentages: {
        red: parseFloat(redPercent),
        yellow: parseFloat(yellowPercent),
        blue: parseFloat(bluePercent)
      }
    }
    
    log('POST /robot/dispense ' + JSON.stringify(body, null, 2))

    let r=await fetch('/robot/dispense',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(body)
    })
    
    if (!r.ok) {
      const error = await r.text()
      throw new Error(`HTTP ${r.status}: ${error}`)
    }
    
    let {cmd_id}=await r.json()
    log('cmd_id='+cmd_id)

    // poll status every second with timeout
    const maxPolls = 60 // 1 minute max
    let polls = 0
    while(polls < maxPolls){
      await sleep(1000)
      polls++
      
      try {
        let statusResp = await fetch('/robot/'+cmd_id+'/status')
        if (!statusResp.ok) {
          throw new Error(`Status check failed: ${statusResp.status}`)
        }
        
        let s = await statusResp.json()
        log('status='+JSON.stringify(s))
        if(s.status!=='running') break
      } catch (e) {
        log('Error checking status: ' + e.message)
        break
      }
    }
    
    if (polls >= maxPolls) {
      log('Timeout waiting for completion')
      return
    }
    
    // fetch snapshot with timeout
    try {
      let snapResp = await fetch('/robot/'+cmd_id+'/pose-snapshot')
      if (!snapResp.ok) {
        throw new Error(`Snapshot failed: ${snapResp.status}`)
      }
      let snap = await snapResp.json()
      document.querySelector('#snap').src=snap.url
      log('Snapshot captured successfully')
    } catch (e) {
      log('Error capturing snapshot: ' + e.message)
    }
  } catch (e) {
    log('Error: ' + e.message)
  }
}

function log(txt){
  const logEl = document.querySelector('#log')
  logEl.textContent += new Date().toLocaleTimeString() + ': ' + txt + "\n"
  logEl.scrollTop = logEl.scrollHeight
}

// Initialize preview on page load
window.onload = function() {
  updatePreview()
}
</script>
