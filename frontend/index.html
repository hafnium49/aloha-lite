<!DOCTYPE html>
<html lang="ja">
<meta charset="utf-8">
<title>色混合コンソール — Hue Optimiser</title>

<!-- ——— STYLE  (mostly unchanged) ——— -->
<style>
/* …——— (identical global CSS from your original file) ——— */
*{box-sizing:border-box}body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;margin:0;padding:2rem;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;color:#333}.container{max-width:1400px;margin:0 auto;background:rgba(255,255,255,.95);border-radius:20px;padding:2rem;box-shadow:0 20px 40px rgba(0,0,0,.1);backdrop-filter:blur(10px)}h1{text-align:center;color:#2c3e50;font-size:2.5rem;margin-bottom:2rem;text-shadow:2px 2px 4px rgba(0,0,0,.1);background:linear-gradient(45deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent}/* grid & panels */.main-grid{display:grid;grid-template-columns:1fr 1fr;gap:2rem;margin-bottom:2rem}.left-column,.right-column{display:flex;flex-direction:column;gap:1.5rem}.full-width{grid-column:1/-1}section{background:#fff;border-radius:15px;padding:1.5rem;box-shadow:0 8px 25px rgba(0,0,0,.1);border:1px solid rgba(255,255,255,.2);transition:.3s}section:hover{transform:translateY(-2px);box-shadow:0 12px 35px rgba(0,0,0,.15)}section h2{margin:0 0 1rem;font-size:1.5rem;font-weight:600}/* specific colours */.target-color{border-left:5px solid #ffc107;background:linear-gradient(135deg,#fff9e6 0%,#fff3cd 100%)}.color-mixing{border-left:5px solid #17a2b8;background:linear-gradient(135deg,#e6f7ff 0%,#b3e5fc 100%)}.beaker-analysis{border-left:5px solid #007bff;background:linear-gradient(135deg,#e3f2fd 0%,#bbdefb 100%)}.ml-optimization{border-left:5px solid #28a745;background:linear-gradient(135deg,#e8f5e8 0%,#c3e6cb 100%)}/* inputs & preview */.color-ratio{display:flex;align-items:center;gap:1rem;margin:1rem 0;padding:.75rem;background:rgba(255,255,255,.7);border-radius:10px}.color-ratio:hover{background:rgba(255,255,255,.9);transform:translateX(5px)}.color-ratio span{min-width:80px;font-weight:600;font-size:1.1rem}.color-ratio input{flex:1;min-width:80px;padding:.75rem;border:2px solid #dee2e6;border-radius:8px;font-size:1rem}.color-ratio input:focus{outline:none;border-color:#007bff;box-shadow:0 0 0 3px rgba(0,123,255,.1)}#color-preview{width:100%;height:60px;margin:1.5rem 0;border:3px solid #dee2e6;border-radius:12px;box-shadow:inset 0 2px 8px rgba(0,0,0,.1)}/* buttons */button{padding:.875rem 1.5rem;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;transition:.3s;box-shadow:0 4px 12px rgba(0,0,0,.1)}button:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.2)}button[onclick="send()"]{background:linear-gradient(135deg,#28a745 0%,#20c997 100%);color:#fff;font-size:1.1rem}button[onclick="generateNewTarget()"]{background:linear-gradient(135deg,#ffc107 0%,#fd7e14 100%);color:#fff}button[onclick="getRecommendation()"]{background:linear-gradient(135deg,#007bff 0%,#0056b3 100%);color:#fff}button[onclick="applyRecommendation()"]{background:linear-gradient(135deg,#6f42c1 0%,#e83e8c 100%);color:#fff}/* log & misc (unchanged) */#log{background:#2c3e50;color:#ecf0f1;padding:1rem;border-radius:10px;font-family:'Courier New',monospace;font-size:.9rem;max-height:300px;overflow-y:auto;margin-top:1rem}.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1rem;margin:1rem 0}.stat-item{text-align:center;padding:.75rem;background:rgba(255,255,255,.7);border-radius:8px;border:1px solid #e9ecef}.stat-item strong{display:block;font-size:.9rem;color:#6c757d;margin-bottom:.25rem}.stat-item span{font-size:1.1rem;font-weight:600;color:#2c3e50}
</style>

<div class="container">
  <h1>🎨 色混合 + ビーカー分析 + ML最適化 <small>(Hue)</small></h1>

  <div class="main-grid">
    <!-- ── LEFT COLUMN ───────────────────────────── -->
    <div class="left-column">
      <section class="target-color">
        <h2>🎯 目標色相 (Hue)</h2>
        <div id="target-color-display" style="display:flex;align-items:center;gap:1.5rem">
          <div id="target-color-swatch" style="width:80px;height:80px;border:4px solid #333;border-radius:12px"></div>
          <div>
            <div id="target-color-text">Hue&nbsp;0 °</div>
            <div id="target-color-hex">#FF0000</div>
          </div>
          <button onclick="generateNewTarget()">新しい目標色を生成</button>
        </div>
      </section>

      <section class="color-mixing">
        <h2>🎨 色混合 - 現在の試行</h2>
        <label>色の比率（部分）</label>

        <div class="color-ratio"><span style="color:#dc3545">赤:</span>
          <input id="red-ratio"    type="number" min="0" step="0.1" value="1" onchange="updatePreview()">
        </div>
        <div class="color-ratio"><span style="color:#ffc107">黄:</span>
          <input id="yellow-ratio" type="number" min="0" step="0.1" value="1" onchange="updatePreview()">
        </div>
        <div class="color-ratio"><span style="color:#007bff">青:</span>
          <input id="blue-ratio"   type="number" min="0" step="0.1" value="1" onchange="updatePreview()">
        </div>

        <div id="color-preview"></div>
        <button onclick="send()">混合を調剤してスナップ撮影</button>
        <img id="snap" style="display:none">
      </section>
    </div>

    <!-- ── RIGHT COLUMN ──────────────────────────── -->
    <div class="right-column">
      <section class="ml-optimization">
        <h2>🧠 ML最適化システム</h2>
        <div id="ml-available-indicator" style="color:#28a745">✅ 機械学習が利用可能</div>

        <div id="ml-recommendations">
          <h3>🎯 次回推奨比率</h3>
          <div id="recommended-ratios" style="display:none">
            <div class="color-ratio"><span style="color:#dc3545">赤:</span><span id="rec-red-value">1.0</span></div>
            <div class="color-ratio"><span style="color:#ffc107">黄:</span><span id="rec-yellow-value">1.0</span></div>
            <div class="color-ratio"><span style="color:#007bff">青:</span><span id="rec-blue-value">1.0</span></div>
          </div>
          <div style="display:flex;gap:.5rem">
            <button onclick="getRecommendation()">推奨比率を取得</button>
            <button onclick="applyRecommendation()">推奨値を適用</button>
          </div>
        </div>

        <div id="optimization-stats" style="display:none">
          <h3>📊 最適化統計</h3>
          <div class="stats-grid">
            <div class="stat-item"><strong>試行回数</strong><br><span id="total-attempts">0</span></div>
            <div class="stat-item"><strong>最良Δh (°)</strong><br><span id="best-distance">‑</span></div>
            <div class="stat-item"><strong>現在Δh (°)</strong><br><span id="current-distance">‑</span></div>
            <div class="stat-item"><strong>平均Δh (°)</strong><br><span id="average-distance">‑</span></div>
          </div>

          <div id="hue-chart" style="margin-top:1.5rem">
            <h4>📈 色相の進捗</h4>
            <canvas id="hue-canvas" width="500" height="300"></canvas>
          </div>
        </div>

        <div style="margin-top:1rem">
          <button onclick="resetOptimization()" style="background:#dc3545;color:#fff">最適化履歴をリセット</button>
          <button onclick="showOptimizationHistory()">履歴を表示</button>
        </div>
      </section>
    </div>
  </div>

  <!-- FULL‑WIDTH SECTIONS (beaker analysis, log) -->
  <section class="beaker-analysis">
    <h2>🔬 ビーカー分析 - 色クラスタリング</h2>
    <div style="display:flex;gap:1rem;flex-wrap:wrap">
      <button onclick="captureAndAnalyze()">📷 撮影して分析</button>
      <button onclick="resetAnalysis()">🔄 分析リセット</button>
    </div>
    <div id="analysis-result" style="display:none">
      <h3>📊 分析結果</h3>
      <div id="analysis-content"></div>
    </div>
  </section>

  <section>
    <h2>📝 システムログ</h2>
    <pre id="log"></pre>
  </section>
</div>

<!-- ——— SCRIPTS  (adapted) ——— -->
<script>
async function sleep(ms){return new Promise(r=>setTimeout(r,ms))}

/* ---------- UI helpers (unchanged ratios preview) ----------------------- */
function updatePreview(){
  const r=+red.value||0,y=+yellow.value||0,b=+blue.value||0,total=r+y+b
  colorPreview.style.background = total?`linear-gradient(to right,#dc3545 0%,#dc3545 ${(r/total*100).toFixed(1)}%,#ffc107 ${(r/total*100).toFixed(1)}%,#ffc107 ${((r+y)/total*100).toFixed(1)}%,#007bff ${((r+y)/total*100).toFixed(1)}%,#007bff 100%)`:'#f8f9fa'
}
const red   = document.getElementById('red-ratio')
const yellow= document.getElementById('yellow-ratio')
const blue  = document.getElementById('blue-ratio')
const colorPreview = document.getElementById('color-preview')

/* ---------- log --------------------------------------------------------- */
function log(txt){
  const el=document.getElementById('log')
  el.textContent += new Date().toLocaleTimeString()+': '+txt+'\n'
  el.scrollTop=el.scrollHeight
}

/* ---------- robot interaction ------------------------------------------- */
async function send() {
  try {
    log('🤖 ロボットに送信中...')
    const response = await fetch('/robot/dispense', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        red: parseFloat(red.value) || 0,
        yellow: parseFloat(yellow.value) || 0,
        blue: parseFloat(blue.value) || 0
      })
    })
    
    if (!response.ok) {
      throw new Error(`HTTP ${response.status}: ${response.statusText}`)
    }
    
    const data = await response.json()
    log('✅ ロボット応答: ' + JSON.stringify(data))
    
    // Auto-capture after dispensing
    await sleep(2000)
    await captureAndAnalyze()
    
  } catch (error) {
    log('❌ エラー: ' + error.message)
  }
}

async function captureAndAnalyze() {
  try {
    log('📷 画像キャプチャ中...')
    const response = await fetch('/vision/capture', { method: 'POST' })
    
    if (!response.ok) {
      throw new Error(`HTTP ${response.status}: ${response.statusText}`)
    }
    
    const blob = await response.blob()
    const imageUrl = URL.createObjectURL(blob)
    
    const snapImg = document.getElementById('snap')
    snapImg.src = imageUrl
    snapImg.style.display = 'block'
    
    log('✅ 画像キャプチャ完了')
    
    // Analyze the captured image
    await analyzeImage(blob)
    
  } catch (error) {
    log('❌ キャプチャエラー: ' + error.message)
  }
}

async function analyzeImage(imageBlob) {
  try {
    log('🔍 画像分析中...')
    
    const formData = new FormData()
    formData.append('image', imageBlob, 'capture.jpg')
    
    const response = await fetch('/vision/analyze', {
      method: 'POST',
      body: formData
    })
    
    if (!response.ok) {
      throw new Error(`HTTP ${response.status}: ${response.statusText}`)
    }
    
    const analysis = await response.json()
    displayAnalysis(analysis)
    
    // Send measurement to ML system
    if (analysis.dominant_color && analysis.dominant_color.rgb) {
      await submitMeasurement(analysis.dominant_color.rgb)
    }
    
    log('✅ 画像分析完了')
    
  } catch (error) {
    log('❌ 分析エラー: ' + error.message)
  }
}

function displayAnalysis(analysis) {
  const resultDiv = document.getElementById('analysis-result')
  const contentDiv = document.getElementById('analysis-content')
  
  let html = ''
  
  if (analysis.dominant_color) {
    const rgb = analysis.dominant_color.rgb
    const hex = analysis.dominant_color.hex
    html += `<div class="cluster-info">
      <div style="display:flex;align-items:center;gap:1rem">
        <div style="width:40px;height:40px;background:${hex};border:3px solid #333;border-radius:8px"></div>
        <div>
          <strong>主要色:</strong> RGB(${rgb.join(', ')}) | ${hex}<br>
          <strong>覆盖率:</strong> ${(analysis.dominant_color.coverage * 100).toFixed(1)}%
        </div>
      </div>
    </div>`
  }
  
  if (analysis.color_clusters && analysis.color_clusters.length > 0) {
    html += '<h4>🎨 色クラスター</h4>'
    analysis.color_clusters.forEach((cluster, i) => {
      const rgb = cluster.center
      const hex = `#${rgb.map(c => Math.round(c).toString(16).padStart(2, '0')).join('')}`
      html += `<div class="cluster-info">
        <div style="display:flex;align-items:center;gap:1rem">
          <div style="width:30px;height:30px;background:${hex};border:2px solid #333;border-radius:6px"></div>
          <div>
            <strong>クラスター ${i + 1}:</strong> RGB(${rgb.map(c => Math.round(c)).join(', ')}) | ${hex}<br>
            <strong>ピクセル数:</strong> ${cluster.size} | <strong>比率:</strong> ${(cluster.percentage).toFixed(1)}%
          </div>
        </div>
      </div>`
    })
  }
  
  if (analysis.statistics) {
    const stats = analysis.statistics
    html += `<div class="stats-grid">
      <div class="stat-item"><strong>総ピクセル数</strong><br><span>${stats.total_pixels}</span></div>
      <div class="stat-item"><strong>ユニーク色数</strong><br><span>${stats.unique_colors}</span></div>
      <div class="stat-item"><strong>平均輝度</strong><br><span>${stats.avg_brightness?.toFixed(1) || 'N/A'}</span></div>
      <div class="stat-item"><strong>色多様性</strong><br><span>${stats.color_diversity?.toFixed(3) || 'N/A'}</span></div>
    </div>`
  }
  
  contentDiv.innerHTML = html
  resultDiv.style.display = 'block'
}

async function submitMeasurement(measuredRgb) {
  try {
    const currentRatios = {
      red: parseFloat(red.value) || 0,
      yellow: parseFloat(yellow.value) || 0,
      blue: parseFloat(blue.value) || 0
    }
    
    const response = await fetch('/api/recommend-ratios', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        measured_rgb: measuredRgb,
        ratios: currentRatios
      })
    })
    
    const data = await response.json()
    if (data.status === 'success') {
      updateStats(data.statistics)
      log(`📊 測定値をMLシステムに送信: RGB(${measuredRgb.join(', ')})`)
    }
    
  } catch (error) {
    log('❌ 測定送信エラー: ' + error.message)
  }
}

function resetAnalysis() {
  document.getElementById('analysis-result').style.display = 'none'
  document.getElementById('snap').style.display = 'none'
  log('🔄 分析結果をリセットしました')
}

/* ---------- API helpers for hue system ---------------------------------- */
async function loadTargetColor(){
  const r = await fetch('/api/target-color'); const d = await r.json()
  if(d.status==='success'){ showTarget(d) }
}
function showTarget(d){
  const sw=document.getElementById('target-color-swatch')
  sw.style.background=d.target_hex
  document.getElementById('target-color-text').textContent=`Hue ${d.target_hue.toFixed(1)}°`
  document.getElementById('target-color-hex').textContent = d.target_hex.toUpperCase()
}

async function generateNewTarget(){
  const r=await fetch('/api/target-color'); const d=await r.json()
  if(d.status==='success'){
     showTarget(d); await resetOptimization(); await getRecommendation()
     log(`🎯 新しい目標色相 ${d.target_hue.toFixed(1)}°`)
  }
}

/* ---------- ML recommendation, stats (minor text tweaks) ---------------- */
async function getRecommendation(){
  const r=await fetch('/api/recommend-ratios',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'})
  const d=await r.json()
  if(d.status==='success'){
     const rr=d.recommended_ratios
     recRed.textContent   = rr.red.toFixed(2)
     recYellow.textContent= rr.yellow.toFixed(2)
     recBlue.textContent  = rr.blue.toFixed(2)
     recommendedRatios.style.display='block'
     updateStats(d.statistics)
  }
}
function applyRecommendation(){
  red.value   = +recRed.textContent
  yellow.value= +recYellow.textContent
  blue.value  = +recBlue.textContent
  updatePreview(); log('📝 推奨値を適用しました')
}
function updateStats(s){
  totalAttempts.textContent = s.total_attempts
  bestDistance.textContent  = s.best_distance  ? s.best_distance.toFixed(1):'‑'
  currentDistance.textContent=s.current_distance? s.current_distance.toFixed(1):'‑'
  averageDistance.textContent=s.average_distance? s.average_distance.toFixed(1):'‑'
  optimizationStats.style.display='block'
  drawHueChart()
}

async function resetOptimization() {
  try {
    const response = await fetch('/api/reset-optimization', { method: 'POST' })
    const data = await response.json()
    if (data.status === 'success') {
      document.getElementById('optimization-stats').style.display = 'none'
      document.getElementById('recommended-ratios').style.display = 'none'
      log('🔄 最適化履歴をリセットしました')
    }
  } catch (error) {
    log('❌ リセットエラー: ' + error.message)
  }
}

async function showOptimizationHistory() {
  try {
    const response = await fetch('/api/optimization-history')
    const data = await response.json()
    if (data.status === 'success') {
      log(`📋 最適化履歴 (${data.history.length}件):`)
      data.history.forEach((entry, i) => {
        const ratios = `R:${entry.ratios.red.toFixed(1)} Y:${entry.ratios.yellow.toFixed(1)} B:${entry.ratios.blue.toFixed(1)}`
        const rgb = `RGB(${entry.measured_rgb.join(',')})`
        const hue = `H:${entry.hue.toFixed(1)}°`
        const dist = entry.distance ? `Δ:${entry.distance.toFixed(1)}°` : 'Δ:N/A'
        log(`  ${i+1}. ${ratios} → ${rgb} ${hue} ${dist}`)
      })
    }
  } catch (error) {
    log('❌ 履歴取得エラー: ' + error.message)
  }
}

/* ---------- Hue progress chart ------------------------------------------ */
async function drawHueChart(){
  const res=await fetch('/api/color-space-data'); const d=await res.json()
  if(d.status!=='success'||!d.data.available){return}
  const data=d.data, canvas=document.getElementById('hue-canvas'), ctx=canvas.getContext('2d')
  ctx.clearRect(0,0,canvas.width,canvas.height)
  const pad=40,w=canvas.width-pad*2,h=canvas.height-pad*2
  /* axes */
  ctx.strokeStyle='#666';ctx.lineWidth=2
  ctx.beginPath();ctx.moveTo(pad, pad);ctx.lineTo(pad, pad+h);ctx.lineTo(pad+w,pad+h);ctx.stroke()
  /* grid lines every 60° */
  ctx.strokeStyle='rgba(0,0,0,.15)';ctx.lineWidth=1
  for(let deg=0;deg<=360;deg+=60){
     const y=pad+h - (deg/360)*h
     ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(pad+w,y);ctx.stroke()
     ctx.fillStyle='#333';ctx.font='10px sans-serif'
     ctx.fillText(`${deg}°`,5,y+4)
  }
  /* target line */
  const targetY = pad+h - (data.target.hue/360)*h
  ctx.strokeStyle='red';ctx.setLineDash([5,3]);ctx.beginPath()
  ctx.moveTo(pad,targetY);ctx.lineTo(pad+w,targetY);ctx.stroke();ctx.setLineDash([])
  ctx.fillStyle='red';ctx.fillText('目標',pad+w-35,targetY-6)

  /* plot points */
  data.trail.forEach((p,i)=>{
     const x = pad + (i/(data.trail.length-1||1))*w
     const y = pad+h - (p.hue/360)*h
     ctx.fillStyle=`rgb(${p.rgb.join(',')})`
     ctx.strokeStyle='#000';ctx.lineWidth=1.5
     ctx.beginPath();ctx.arc(x,y,6,0,2*Math.PI);ctx.fill();ctx.stroke()
     ctx.fillStyle='#fff';ctx.font='9px sans-serif'
     ctx.fillText(i+1,x-3,y+3)
  })
}

/* ---------- page init --------------------------------------------------- */
window.addEventListener('DOMContentLoaded',async()=>{
  window.recRed=document.getElementById('rec-red-value')
  window.recYellow=document.getElementById('rec-yellow-value')
  window.recBlue=document.getElementById('rec-blue-value')
  window.recommendedRatios=document.getElementById('recommended-ratios')
  window.totalAttempts=document.getElementById('total-attempts')
  window.bestDistance=document.getElementById('best-distance')
  window.currentDistance=document.getElementById('current-distance')
  window.averageDistance=document.getElementById('average-distance')
  window.optimizationStats=document.getElementById('optimization-stats')
  updatePreview(); await loadTargetColor(); await getRecommendation()
  log('ページ初期化完了')
})
</script>
</html>
