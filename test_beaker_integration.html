<!DOCTYPE html>
<html>
<head>
    <title>Beaker Analysis Integration Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2rem; }
        .beaker-analysis { margin-top: 2rem; padding: 1rem; border: 2px solid #007bff; border-radius: 8px; background: #f8f9fa; }
        .analysis-result { margin-top: 1rem; padding: 1rem; border: 1px solid #ddd; border-radius: 4px; background: white; }
        .color-swatch { display: inline-block; width: 30px; height: 30px; border: 2px solid #333; border-radius: 4px; margin-right: 10px; vertical-align: middle; }
        .cluster-info { margin: 0.5rem 0; padding: 0.5rem; background: #f1f1f1; border-radius: 4px; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 1rem; }
        .stat-item { padding: 0.5rem; background: white; border: 1px solid #ddd; border-radius: 4px; text-align: center; }
        #log { background: #f5f5f5; border: 1px solid #ddd; padding: 1rem; height: 200px; overflow-y: auto; font-family: monospace; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>Beaker Analysis Integration Test</h1>
    
    <button onclick="testAnalysisDisplay()">Test Analysis Display</button>
    <button onclick="testWithRealData()">Test with Real Data</button>
    
    <div id="log"></div>
    
    <div id="analysis-results" class="beaker-analysis" style="display:none">
        <h3>🧪 Beaker Analysis Results</h3>
        <div class="analysis-result"></div>
    </div>

    <script>
        function log(txt) {
            const logEl = document.querySelector('#log')
            logEl.textContent += new Date().toLocaleTimeString() + ': ' + txt + "\n"
            logEl.scrollTop = logEl.scrollHeight
        }

        function rgbToHex(r, g, b) {
            return "#" + [r, g, b].map(x => {
                const hex = x.toString(16)
                return hex.length === 1 ? "0" + hex : hex
            }).join("")
        }

        function displayAnalysisResults(results) {
            try {
                // Show results container
                document.getElementById('analysis-results').style.display = 'block'
                
                // Extract analysis data
                const dominantColor = results.dominant_color || {}
                const beakerCircle = results.beaker_circle || {}
                const clusters = results.clusters || []
                const stats = results.analysis_stats || {}
                
                // Display dominant color
                const hex = dominantColor.hex || '#000000'
                const rgb = dominantColor.rgb || [0, 0, 0]
                
                // Display beaker info
                const x = beakerCircle.x || 0
                const y = beakerCircle.y || 0
                const radius = beakerCircle.radius || 0
                
                // Display analysis stats
                const numClusters = stats.num_clusters || clusters.length
                const totalPixels = stats.total_pixels_analyzed || 0
                
                // Generate clusters list HTML
                let clustersHtml = ''
                clusters.slice(0, 5).forEach((cluster, index) => {
                    const clusterRgb = cluster.rgb || [0, 0, 0]
                    const clusterHex = cluster.hex || rgbToHex(clusterRgb[0], clusterRgb[1], clusterRgb[2])
                    const pixelCount = cluster.pixel_count || 0
                    const saturation = cluster.saturation || 0
                    
                    clustersHtml += `
                        <div class="cluster-info">
                            <div style="display:flex;align-items:center;gap:10px">
                                <span class="color-swatch" style="background-color:${clusterHex}"></span>
                                <div>
                                    <strong>Cluster ${index + 1}</strong> ${clusterHex}<br>
                                    <small>RGB(${clusterRgb.join(', ')}) - Saturation: ${saturation.toFixed(1)}, Pixels: ${pixelCount.toLocaleString()}</small>
                                </div>
                            </div>
                        </div>
                    `
                })
                
                // Update the analysis results display
                const analysisResult = document.querySelector('#analysis-results .analysis-result')
                analysisResult.innerHTML = `
                    <h3>✅ Beaker Analysis Results</h3>
                    <div id="dominant-color-info">
                        <h4>Dominant Solution Color</h4>
                        <div id="color-display">
                            <span class="color-swatch" style="background-color:${hex}"></span>
                            <span>${hex} RGB(${rgb.join(', ')})</span>
                        </div>
                    </div>
                    
                    <div class="stats-grid">
                        <div class="stat-item">
                            <strong>Beaker Position</strong><br>
                            <span>(${x}, ${y})</span>
                        </div>
                        <div class="stat-item">
                            <strong>Beaker Radius</strong><br>
                            <span>${radius}px</span>
                        </div>
                        <div class="stat-item">
                            <strong>Clusters Found</strong><br>
                            <span>${numClusters}</span>
                        </div>
                        <div class="stat-item">
                            <strong>Pixels Analyzed</strong><br>
                            <span>${totalPixels.toLocaleString()}</span>
                        </div>
                    </div>
                    
                    <div id="cluster-details">
                        <h4>Color Clusters (by saturation)</h4>
                        <div id="clusters-list">${clustersHtml}</div>
                    </div>
                `
                
                // Color interpretation
                let interpretation = ''
                if (hex.toLowerCase().includes('ff0000') || hex.toLowerCase().includes('dc143c') || (rgb[0] > 150 && rgb[1] < 100 && rgb[2] < 100)) {
                    interpretation = '🔴 Red solution detected - likely contains red dye or indicator'
                } else if (hex.toLowerCase().includes('ffff00') || hex.toLowerCase().includes('ffd700') || (rgb[0] > 200 && rgb[1] > 200 && rgb[2] < 100)) {
                    interpretation = '🟡 Yellow solution detected - likely contains yellow dye or indicator'
                } else if (hex.toLowerCase().includes('0000ff') || hex.toLowerCase().includes('1e90ff') || (rgb[0] < 100 && rgb[1] < 100 && rgb[2] > 150)) {
                    interpretation = '🔵 Blue solution detected - likely contains blue dye or indicator'
                } else if (rgb[0] < 50 && rgb[1] < 50 && rgb[2] < 50) {
                    interpretation = '⚫ Dark/black solution detected'
                } else if (rgb[0] > 200 && rgb[1] > 200 && rgb[2] > 200) {
                    interpretation = '⚪ Clear/transparent solution detected'
                } else {
                    interpretation = `🎨 Custom color solution detected: ${hex}`
                }
                
                // Add interpretation
                const interpretationDiv = document.createElement('div')
                interpretationDiv.style.cssText = 'margin-top:1rem;padding:1rem;background:#e7f3ff;border:1px solid #007bff;border-radius:4px'
                interpretationDiv.innerHTML = `<h4>🧪 Color Interpretation</h4><p>${interpretation}</p>`
                analysisResult.appendChild(interpretationDiv)
                
                log('🎨 Beaker analysis results displayed successfully')
                
            } catch (error) {
                log('Error displaying analysis results: ' + error.message)
                document.getElementById('analysis-results').style.display = 'block'
                document.querySelector('#analysis-results .analysis-result').innerHTML = 
                    `<p style="color:red">Error displaying analysis results: ${error.message}</p>`
            }
        }

        function testAnalysisDisplay() {
            log('Testing analysis display with sample data...')
            
            const testData = {
                dominant_color: {
                    rgb: [255, 100, 50],
                    hex: "#ff6432"
                },
                beaker_circle: {
                    x: 320,
                    y: 240,
                    radius: 150
                },
                clusters: [
                    {
                        rgb: [255, 100, 50],
                        hex: "#ff6432",
                        saturation: 85.2,
                        pixel_count: 12345
                    },
                    {
                        rgb: [100, 150, 200],
                        hex: "#6496c8",
                        saturation: 62.5,
                        pixel_count: 8765
                    }
                ],
                analysis_stats: {
                    num_clusters: 5,
                    total_pixels_analyzed: 25000
                }
            }
            
            displayAnalysisResults(testData)
        }

        function testWithRealData() {
            log('Testing with real beaker analysis data structure...')
            
            // Simulate the actual data structure from the robot service
            const realData = {
                dominant_color: {
                    rgb: [87, 67, 59],
                    hex: "#57433b"
                },
                beaker_circle: {
                    x: 381,
                    y: 158,
                    radius: 197
                },
                clusters: [
                    {
                        rgb: [87, 67, 59],
                        hex: "#57433b",
                        saturation: 74.03650672759584,
                        pixel_count: 19695
                    },
                    {
                        rgb: [206, 209, 197],
                        hex: "#ced1c5",
                        saturation: 15.56114050558495,
                        pixel_count: 3402
                    },
                    {
                        rgb: [149, 152, 144],
                        hex: "#959890",
                        saturation: 16.95375480040017,
                        pixel_count: 30987
                    }
                ],
                analysis_stats: {
                    num_clusters: 3,
                    total_pixels_analyzed: 54084
                }
            }
            
            displayAnalysisResults(realData)
        }

        // Initialize
        window.onload = function() {
            log('Beaker Analysis Integration Test initialized')
            log('Click buttons above to test the display functionality')
        }
    </script>
</body>
</html>
